<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f5f0e8"/>
  
  <!-- Decorative border -->
  <rect x="20" y="20" width="1160" height="590" fill="none" stroke="#c9b99a" stroke-width="2"/>
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="#c9b99a" stroke-width="1"/>
  
  <!-- Compass decoration -->
  <circle cx="600" cy="200" r="60" fill="none" stroke="#c9b99a" stroke-width="2"/>
  <line x1="600" y1="140" x2="600" y2="260" stroke="#c9b99a" stroke-width="2"/>
  <line x1="540" y1="200" x2="660" y2="200" stroke="#c9b99a" stroke-width="2"/>
  <text x="600" y="155" text-anchor="middle" font-family="serif" font-size="16" fill="#5c4a3d">N</text>
  
  <!-- Title -->
  <text x="600" y="350" text-anchor="middle" font-family="Georgia, serif" font-size="64" font-weight="bold" fill="#3d3229">
