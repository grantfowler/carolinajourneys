  </text>
  <text x="600" y="460" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-style="italic" fill="#6b5c4d">
    both real and imagined
  </text>
  
  <!-- Decorative line -->
  <line x1="400" y1="520" x2="550" y2="520" stroke="#c9b99a" stroke-width="1"/>
  <text x="600" y="527" text-anchor="middle" font-family="serif" font-size="20" fill="#c9b99a">✦</text>
  <line x1="650" y1="520" x2="800" y2="520" stroke="#c9b99a" stroke-width="1"/>
  
  <!-- Est. -->
  <text x="600" y="570" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#8b7355">
    Est. 2004
  </text>
